name: Release SDK

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 3.1.2)'
        required: true
        default: '3.1.2'
      next_version:
        description: 'Next SNAPSHOT version (e.g. 3.1.3-SNAPSHOT)'
        required: true
        default: '3.1.3-SNAPSHOT'

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Manage GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process Release via Workflow Dispatch
        if: github.event_name == 'workflow_dispatch'
        id: dispatch_release
        run: |
          RELEASE_VER="${{ inputs.release_version }}"
          NEXT_VER="${{ inputs.next_version }}"
          TAG_NAME="v${RELEASE_VER}"
          
          echo "Setting release version to ${RELEASE_VER}..."
          mvn versions:set -DnewVersion="${RELEASE_VER}" -DgenerateBackupPoms=false
          
          echo "Committing release version..."
          git commit -am "Release version ${RELEASE_VER}"
          
          echo "Creating tag ${TAG_NAME}..."
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          
          echo "Setting next development version to ${NEXT_VER}..."
          mvn versions:set -DnewVersion="${NEXT_VER}" -DgenerateBackupPoms=false
          
          echo "Committing next snapshot version..."
          git commit -am "[skip ci] Next development version ${NEXT_VER}"
          
          echo "Pushing branch and tag to origin..."
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${TAG_NAME}"
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=Release ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Determine Tag for Push Event
        if: github.event_name == 'push'
        id: push_release
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=Release ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.dispatch_release.outputs.tag_name || steps.push_release.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.dispatch_release.outputs.release_name || steps.push_release.outputs.release_name }}
        run: |
          echo "Creating GitHub Release for ${TAG_NAME}..."
          gh release create "${TAG_NAME}" \
            --title "${RELEASE_NAME}" \
            --generate-notes
